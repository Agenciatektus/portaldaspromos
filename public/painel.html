<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — Portal de Promos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .logo { font-size: 1rem; font-weight: 700; color: #f8fafc; }
    .logo span { color: #6366f1; }
    header a {
      font-size: 0.85rem;
      color: #94a3b8;
      text-decoration: none;
      border: 1px solid #334155;
      padding: 0.3rem 0.75rem;
      border-radius: 6px;
      transition: color 0.2s, border-color 0.2s;
    }
    header a:hover { color: #e2e8f0; border-color: #6366f1; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 0 1.5rem;
      gap: 0.25rem;
    }
    .tab {
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      user-select: none;
    }
    .tab:hover { color: #cbd5e1; }
    .tab.ativa { color: #6366f1; border-bottom-color: #6366f1; }

    /* ── Content ── */
    .conteudo { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    .secao { display: none; }
    .secao.ativa { display: block; }

    /* ── Cards de status ── */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .card-titulo { font-size: 0.75rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
    .card-valor { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-ok    { background: #4ade80; }
    .dot-erro  { background: #f87171; }
    .dot-wait  { background: #fbbf24; }
    .dot-none  { background: #475569; }
    .card-sub  { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }

    /* ── Variáveis expandível ── */
    .vars-lista { margin-top: 0.75rem; display: none; }
    .vars-lista.aberta { display: block; }
    .var-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: #94a3b8; padding: 0.15rem 0; }
    .var-item .ok   { color: #4ade80; }
    .var-item .nok  { color: #f87171; }

    /* ── Botões ── */
    .btn {
      padding: 0.55rem 1rem;
      border-radius: 7px;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary  { background: #6366f1; color: #fff; }
    .btn-primary:hover:not(:disabled)  { background: #4f46e5; }
    .btn-danger   { background: #dc2626; color: #fff; }
    .btn-danger:hover:not(:disabled)   { background: #b91c1c; }
    .btn-warning  { background: #d97706; color: #fff; }
    .btn-warning:hover:not(:disabled)  { background: #b45309; }
    .btn-ghost    { background: transparent; color: #94a3b8; border: 1px solid #334155; }
    .btn-ghost:hover:not(:disabled)    { color: #e2e8f0; border-color: #6366f1; }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.78rem; }

    .toolbar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }

    /* ── Tabela ── */
    .tabela-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid #334155; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th {
      background: #1e293b;
      color: #64748b;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      padding: 0.65rem 0.85rem;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid #1e293b;
      vertical-align: middle;
      color: #cbd5e1;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1e293b44; }
    .truncate { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Badges de status ── */
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .badge-pendente  { background: #1e3a5f; color: #60a5fa; }
    .badge-postado   { background: #14532d; color: #4ade80; }
    .badge-erro      { background: #450a0a; color: #f87171; }
    .badge-cancelado { background: #1e293b; color: #475569; border: 1px solid #334155; }

    /* ── Filtros ── */
    .filtros { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filtro {
      padding: 0.3rem 0.75rem;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #334155;
      color: #64748b;
      background: transparent;
      transition: all 0.15s;
    }
    .filtro:hover   { color: #e2e8f0; border-color: #6366f1; }
    .filtro.ativo   { background: #6366f1; color: #fff; border-color: #6366f1; }

    /* ── Cron card ── */
    .cron-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 1.5rem;
      max-width: 480px;
    }
    .cron-estado {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
    }
    .cron-linha { display: flex; justify-content: space-between; font-size: 0.875rem; padding: 0.4rem 0; border-bottom: 1px solid #1e293b; }
    .cron-linha:last-of-type { border-bottom: none; }
    .cron-label { color: #64748b; }
    .cron-valor { color: #e2e8f0; font-weight: 500; }
    .cron-actions { margin-top: 1.25rem; }

    /* ── Logs ── */
    .log-area {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 0.78rem;
      line-height: 1.6;
      color: #94a3b8;
      height: 480px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-area .err  { color: #f87171; }
    .log-area .ok   { color: #4ade80; }
    .log-area .warn { color: #fbbf24; }

    /* ── Grupos WA ── */
    #tabelaGrupos { margin-top: 1rem; display: none; }

    /* ── Alertas inline ── */
    .alerta {
      padding: 0.65rem 1rem;
      border-radius: 7px;
      font-size: 0.875rem;
      margin-top: 0.75rem;
      display: none;
    }
    .alerta.success { background: #14532d; color: #86efac; display: block; }
    .alerta.error   { background: #450a0a; color: #fca5a5; display: block; }

    /* ── Empty state ── */
    .vazio { text-align: center; color: #475569; padding: 3rem 1rem; font-size: 0.875rem; }

    /* ── Toggle ── */
    .toggle-label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: #64748b; cursor: pointer; }
    .toggle-label input[type="checkbox"] { accent-color: #6366f1; width: 14px; height: 14px; }

    /* ── Seção subtítulo ── */
    .secao-titulo { font-size: 1rem; font-weight: 700; color: #f1f5f9; margin-bottom: 1rem; }
    .secao-sep { border: none; border-top: 1px solid #1e293b; margin: 1.5rem 0; }
  </style>
</head>
<body>

<header>
  <div class="logo">🎯 Portal de <span>Promos</span> — Painel</div>
  <a href="/">+ Adicionar vídeo</a>
</header>

<div class="tabs">
  <div class="tab ativa" data-tab="status">Status</div>
  <div class="tab" data-tab="fila">Fila</div>
  <div class="tab" data-tab="automacao">Automação</div>
  <div class="tab" data-tab="logs">Logs</div>
</div>

<div class="conteudo">

  <!-- ── ABA STATUS ── -->
  <div class="secao ativa" id="tab-status">
    <div class="toolbar">
      <button class="btn btn-ghost" onclick="carregarStatus()">↻ Atualizar</button>
      <button class="btn btn-primary" onclick="testarWhatsApp()" id="btnTestarWA">Testar WhatsApp</button>
    </div>
    <div id="alertaWA" class="alerta"></div>

    <div class="cards" id="cardsStatus">
      <div class="card"><div class="card-titulo">WhatsApp</div><div class="card-valor"><span class="dot dot-none"></span> Carregando...</div></div>
      <div class="card"><div class="card-titulo">Planilha</div><div class="card-valor"><span class="dot dot-none"></span> Carregando...</div></div>
      <div class="card"><div class="card-titulo">Drive</div><div class="card-valor"><span class="dot dot-none"></span> Carregando...</div></div>
      <div class="card" id="cardVars" style="cursor:pointer" onclick="toggleVars()">
        <div class="card-titulo">Variáveis de Ambiente</div>
        <div class="card-valor" id="cardVarsValor"><span class="dot dot-none"></span> Carregando...</div>
        <div class="vars-lista" id="varsLista"></div>
      </div>
    </div>

    <hr class="secao-sep">

    <div class="secao-titulo">Grupos WhatsApp</div>
    <button class="btn btn-ghost" onclick="listarGrupos()" id="btnGrupos">Listar grupos</button>
    <div id="tabelaGrupos"></div>
  </div>

  <!-- ── ABA FILA ── -->
  <div class="secao" id="tab-fila">
    <div class="toolbar">
      <div class="filtros" id="filtros">
        <button class="filtro ativo" data-filtro="">Todos</button>
        <button class="filtro" data-filtro="Pendente">🟡 Pendente</button>
        <button class="filtro" data-filtro="Postado">✅ Postado</button>
        <button class="filtro" data-filtro="Erro">❌ Erro</button>
        <button class="filtro" data-filtro="Cancelado">⊘ Cancelado</button>
      </div>
      <button class="btn btn-ghost" onclick="carregarFila()">↻ Atualizar</button>
    </div>
    <div id="tabelaFila"></div>
  </div>

  <!-- ── ABA AUTOMAÇÃO ── -->
  <div class="secao" id="tab-automacao">
    <div class="cron-card">
      <div class="cron-estado" id="cronEstado">
        <span class="dot dot-none"></span> Carregando...
      </div>
      <div class="cron-linha">
        <span class="cron-label">Última execução</span>
        <span class="cron-valor" id="cronUltima">—</span>
      </div>
      <div class="cron-linha">
        <span class="cron-label">Próxima execução</span>
        <span class="cron-valor" id="cronProxima">—</span>
      </div>
      <div class="cron-linha">
        <span class="cron-label">Último resultado</span>
        <span class="cron-valor" id="cronResultado">—</span>
      </div>
      <div class="cron-actions">
        <button class="btn btn-primary" id="btnDisparar" onclick="dispararCron()">▶ Executar Agora</button>
      </div>
    </div>
    <div id="alertaCron" class="alerta" style="max-width:480px"></div>
  </div>

  <!-- ── ABA LOGS ── -->
  <div class="secao" id="tab-logs">
    <div class="toolbar">
      <button class="btn btn-ghost" onclick="carregarLogs()">↻ Atualizar</button>
      <label class="toggle-label">
        <input type="checkbox" id="autoLogs" onchange="toggleAutoLogs()">
        Auto-atualizar (10s)
      </label>
    </div>
    <div class="log-area" id="logArea">Carregando...</div>
  </div>

</div>

<script>
// ── Navegação por abas ──────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('ativa'));
    document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
    tab.classList.add('ativa');
    document.getElementById('tab-' + tab.dataset.tab).classList.add('ativa');
    if (tab.dataset.tab === 'status')    carregarStatus();
    if (tab.dataset.tab === 'fila')      carregarFila();
    if (tab.dataset.tab === 'automacao') carregarCron();
    if (tab.dataset.tab === 'logs')      carregarLogs();
  });
});

// ── Utilitários ─────────────────────────────────────────────────────────────
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
}

function badgeStatus(status) {
  const map = {
    pendente:  '<span class="badge badge-pendente">🟡 Pendente</span>',
    postado:   '<span class="badge badge-postado">✅ Postado</span>',
    erro:      '<span class="badge badge-erro">❌ Erro</span>',
    cancelado: '<span class="badge badge-cancelado">⊘ Cancelado</span>',
  };
  return map[(status||'').toLowerCase()] || `<span class="badge badge-cancelado">${status}</span>`;
}

function badgePlat(p) {
  const map = { mercadolivre: '#fef3c7;color:#92400e', amazon: '#fde68a;color:#78350f', shopee: '#fee2e2;color:#991b1b' };
  const style = map[p] || '';
  const label = { mercadolivre: 'ML', amazon: 'AMZ', shopee: 'SHP' };
  return `<span style="background:${style};padding:2px 8px;border-radius:99px;font-size:0.72rem;font-weight:600">${label[p]||p}</span>`;
}

// ── ABA STATUS ───────────────────────────────────────────────────────────────
async function carregarStatus() {
  const cards = document.getElementById('cardsStatus');
  try {
    const res = await fetch('/api/status');
    const d = await res.json();

    const mkCard = (titulo, ok, texto, sub = '') => `
      <div class="card">
        <div class="card-titulo">${titulo}</div>
        <div class="card-valor">
          <span class="dot ${ok ? 'dot-ok' : 'dot-erro'}"></span>
          ${texto}
        </div>
        ${sub ? `<div class="card-sub">${sub}</div>` : ''}
      </div>`;

    const waOk   = d.whatsapp?.ok;
    const shOk   = d.sheets?.ok;
    const drOk   = d.drive?.ok;
    const waEstado = d.whatsapp?.estado || (waOk ? 'conectado' : d.whatsapp?.erro || 'erro');

    const vars     = d.variaveis || {};
    const total    = Object.keys(vars).length;
    const config   = Object.values(vars).filter(Boolean).length;
    const varOk    = config === total;

    cards.innerHTML =
      mkCard('WhatsApp', waOk, waOk ? 'Conectado' : 'Desconectado', waEstado) +
      mkCard('Planilha (Sheets)', shOk, shOk ? 'OK' : 'Erro', d.sheets?.erro || '') +
      mkCard('Google Drive', drOk, drOk ? 'OK' : 'Erro', d.drive?.erro || '') +
      `<div class="card" id="cardVars" style="cursor:pointer" onclick="toggleVars()">
        <div class="card-titulo">Variáveis de Ambiente</div>
        <div class="card-valor" id="cardVarsValor">
          <span class="dot ${varOk ? 'dot-ok' : 'dot-wait'}"></span>
          ${config}/${total} configuradas
        </div>
        <div class="vars-lista" id="varsLista">
          ${Object.entries(vars).map(([k, v]) =>
            `<div class="var-item"><span class="${v ? 'ok' : 'nok'}">${v ? '✓' : '✗'}</span>${k}</div>`
          ).join('')}
        </div>
      </div>`;
  } catch (err) {
    cards.innerHTML = `<div class="vazio">Erro ao carregar status: ${err.message}</div>`;
  }
}

function toggleVars() {
  const lista = document.getElementById('varsLista');
  if (lista) lista.classList.toggle('aberta');
}

async function testarWhatsApp() {
  const btn = document.getElementById('btnTestarWA');
  const alerta = document.getElementById('alertaWA');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  alerta.className = 'alerta';
  try {
    const res = await fetch('/api/whatsapp/teste', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const d = await res.json();
    alerta.textContent = res.ok ? '✅ Mensagem de teste enviada no grupo!' : `❌ ${d.error}`;
    alerta.className = res.ok ? 'alerta success' : 'alerta error';
  } catch (err) {
    alerta.textContent = `❌ ${err.message}`;
    alerta.className = 'alerta error';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Testar WhatsApp';
  }
}

async function listarGrupos() {
  const btn = document.getElementById('btnGrupos');
  const div = document.getElementById('tabelaGrupos');
  btn.disabled = true;
  btn.textContent = 'Carregando...';
  try {
    const res = await fetch('/api/whatsapp/grupos');
    const grupos = await res.json();
    const lista = Array.isArray(grupos) ? grupos : (grupos?.data || []);
    if (!lista.length) {
      div.innerHTML = '<p style="color:#64748b;font-size:.875rem;margin-top:.75rem">Nenhum grupo encontrado.</p>';
    } else {
      div.innerHTML = `<div class="tabela-wrap" style="margin-top:.75rem">
        <table>
          <thead><tr><th>Nome</th><th>ID (WHATSAPP_GROUP_ID)</th><th>Participantes</th></tr></thead>
          <tbody>${lista.map(g =>
            `<tr>
              <td>${g.subject || g.name || '—'}</td>
              <td><code style="font-size:.78rem;color:#a5b4fc">${g.id}</code></td>
              <td>${g.size || '—'}</td>
            </tr>`
          ).join('')}</tbody>
        </table></div>`;
    }
    div.style.display = 'block';
  } catch (err) {
    div.innerHTML = `<p style="color:#f87171;font-size:.875rem;margin-top:.75rem">Erro: ${err.message}</p>`;
    div.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Listar grupos';
  }
}

// ── ABA FILA ─────────────────────────────────────────────────────────────────
let filtroAtivo = '';

document.querySelectorAll('.filtro').forEach(f => {
  f.addEventListener('click', () => {
    document.querySelectorAll('.filtro').forEach(x => x.classList.remove('ativo'));
    f.classList.add('ativo');
    filtroAtivo = f.dataset.filtro;
    carregarFila();
  });
});

async function carregarFila() {
  const div = document.getElementById('tabelaFila');
  div.innerHTML = '<p style="color:#64748b;padding:1rem">Carregando...</p>';
  try {
    const url = '/api/fila' + (filtroAtivo ? `?status=${encodeURIComponent(filtroAtivo)}` : '');
    const res = await fetch(url);
    const videos = await res.json();

    if (!videos.length) {
      div.innerHTML = '<div class="vazio">Nenhum vídeo encontrado.</div>';
      return;
    }

    div.innerHTML = `<div class="tabela-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Produto</th><th>Plat.</th><th>Preço</th>
            <th>Status</th><th>YouTube</th><th>Data</th><th>Ações</th>
          </tr>
        </thead>
        <tbody>
          ${videos.map(v => `
            <tr>
              <td style="color:#475569">${v.rowIndex}</td>
              <td class="truncate" title="${v.titulo}">${v.titulo || '—'}</td>
              <td>${badgePlat(v.plataforma)}</td>
              <td style="white-space:nowrap">${v.preco || '—'}</td>
              <td>${badgeStatus(v.status)}</td>
              <td>${v.linkYoutube ? `<a href="${v.linkYoutube}" target="_blank" style="color:#818cf8;font-size:.78rem">▶ ver</a>` : '—'}</td>
              <td style="white-space:nowrap;color:#475569;font-size:.78rem">${v.dataPublicacao ? v.dataPublicacao.split(' ')[0] : '—'}</td>
              <td>${acoesFila(v)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  } catch (err) {
    div.innerHTML = `<div class="vazio">Erro: ${err.message}</div>`;
  }
}

function acoesFila(v) {
  const s = (v.status || '').toLowerCase();
  if (s === 'pendente') return `<button class="btn btn-danger btn-sm" onclick="cancelarVideo(${v.rowIndex})">Cancelar</button>`;
  if (s === 'erro')     return `<button class="btn btn-warning btn-sm" onclick="reprocessarVideo(${v.rowIndex})">Reprocessar</button>`;
  return '';
}

async function cancelarVideo(rowIndex) {
  if (!confirm(`Cancelar o vídeo da linha ${rowIndex}?`)) return;
  try {
    await fetch(`/api/fila/${rowIndex}`, { method: 'DELETE' });
    carregarFila();
  } catch (err) { alert('Erro: ' + err.message); }
}

async function reprocessarVideo(rowIndex) {
  if (!confirm(`Reprocessar o vídeo da linha ${rowIndex}? Ele voltará para a fila como Pendente.`)) return;
  try {
    await fetch(`/api/fila/${rowIndex}/reprocessar`, { method: 'POST' });
    carregarFila();
  } catch (err) { alert('Erro: ' + err.message); }
}

// ── ABA AUTOMAÇÃO ─────────────────────────────────────────────────────────────
let cronPoll = null;

async function carregarCron() {
  try {
    const res = await fetch('/api/cron/estado');
    const d = await res.json();
    const rodando = d.rodando;

    const elEstado   = document.getElementById('cronEstado');
    const elUltima   = document.getElementById('cronUltima');
    const elProxima  = document.getElementById('cronProxima');
    const elResultado = document.getElementById('cronResultado');
    const btnDisparar = document.getElementById('btnDisparar');

    elEstado.innerHTML = rodando
      ? `<span class="dot dot-wait"></span> ⚙️ Processando...`
      : `<span class="dot dot-ok"></span> Aguardando`;

    elUltima.textContent  = fmtDate(d.ultimaExecucao);
    elProxima.textContent = fmtDate(d.proximaExecucao);

    if (d.ultimoResultado) {
      const r = d.ultimoResultado;
      elResultado.textContent = `${r.processados} processados, ${r.erros} erros`;
    } else {
      elResultado.textContent = '—';
    }

    btnDisparar.disabled = rodando;
    btnDisparar.textContent = rodando ? '⚙️ Em execução...' : '▶ Executar Agora';

    if (rodando && !cronPoll) {
      cronPoll = setInterval(carregarCron, 5000);
    } else if (!rodando && cronPoll) {
      clearInterval(cronPoll);
      cronPoll = null;
    }
  } catch (err) {
    console.error(err);
  }
}

async function dispararCron() {
  const btn = document.getElementById('btnDisparar');
  const alerta = document.getElementById('alertaCron');
  btn.disabled = true;
  alerta.className = 'alerta';
  try {
    const res = await fetch('/api/cron/disparar', { method: 'POST' });
    const d = await res.json();
    if (d.iniciado) {
      alerta.textContent = '✅ Ciclo iniciado! Acompanhe na aba Logs.';
      alerta.className = 'alerta success';
      cronPoll = setInterval(carregarCron, 5000);
      carregarCron();
    } else {
      alerta.textContent = `⚠️ ${d.motivo}`;
      alerta.className = 'alerta error';
      btn.disabled = false;
    }
  } catch (err) {
    alerta.textContent = `❌ ${err.message}`;
    alerta.className = 'alerta error';
    btn.disabled = false;
  }
}

// ── ABA LOGS ─────────────────────────────────────────────────────────────────
let logsPoll = null;

async function carregarLogs() {
  const area = document.getElementById('logArea');
  try {
    const res = await fetch('/api/logs?linhas=200');
    const d = await res.json();
    const linhas = d.linhas || [];
    if (!linhas.length) { area.textContent = 'Sem logs ainda.'; return; }

    area.innerHTML = linhas.map(l => {
      const cls = l.includes('❌') || l.includes('Erro') ? 'err'
                : l.includes('✅') || l.includes('concluído') || l.includes('Concluído') ? 'ok'
                : l.includes('⚠️') ? 'warn'
                : '';
      return cls ? `<span class="${cls}">${escHtml(l)}</span>` : escHtml(l);
    }).join('\n');

    area.scrollTop = area.scrollHeight;
  } catch (err) {
    area.textContent = 'Erro ao carregar logs: ' + err.message;
  }
}

function escHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toggleAutoLogs() {
  const on = document.getElementById('autoLogs').checked;
  if (on) { logsPoll = setInterval(carregarLogs, 10000); }
  else    { clearInterval(logsPoll); logsPoll = null; }
}

// ── Init ─────────────────────────────────────────────────────────────────────
carregarStatus();
